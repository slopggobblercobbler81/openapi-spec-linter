[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-cipher-scanner"
version = "0.1.0"
description = "Python CLI that audits SSL/TLS cipher suites and TLS protocol versions for domains or endpoints."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
tls-cipher-scanner = "tls_cipher_scanner:main"

[tool.setuptools]
py-modules = ["tls_cipher_scanner"]
